<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wietnam 2027 — odliczanie</title>
<style>
  :root {
    --lagoon: #0f6f7a;
    --deep: #063b47;
    --foam: #eafaf7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--foam);
    text-align: center;
    background:
      linear-gradient(180deg, rgba(3, 40, 50, .35), rgba(3, 40, 50, .65)),
      url("bg.png") center / cover no-repeat fixed,
      linear-gradient(160deg, #1fb6a6, #0d5f70 60%, #063b47);
  }

  .card {
    width: 100%;
    max-width: 720px;
    padding: 48px 32px;
    border-radius: 24px;
    background: rgba(4, 42, 52, .38);
    border: 1px solid rgba(255, 255, 255, .22);
    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  }

  .kicker {
    font-size: 13px;
    letter-spacing: .35em;
    text-transform: uppercase;
    opacity: .85;
  }

  h1 {
    margin: 12px 0 6px;
    font-size: clamp(34px, 7vw, 60px);
    font-weight: 700;
    letter-spacing: .02em;
    text-shadow: 0 2px 18px rgba(0, 0, 0, .45);
  }

  .date {
    font-size: 16px;
    opacity: .9;
    margin-bottom: 34px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .unit {
    padding: 18px 8px;
    border-radius: 16px;
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .18);
  }

  .num {
    display: block;
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }

  .lbl {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: .16em;
    text-transform: uppercase;
    opacity: .8;
  }

  .footer {
    margin-top: 30px;
    font-size: 15px;
    opacity: .9;
  }

  @media (max-width: 460px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .card { padding: 34px 20px; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="kicker">Odliczanie do wylotu</p>
    <h1>Wietnam 🇻🇳</h1>
    <p class="date">30 kwietnia 2027</p>

    <div class="grid">
      <div class="unit"><span class="num" id="days">--</span><span class="lbl">dni</span></div>
      <div class="unit"><span class="num" id="hours">--</span><span class="lbl">godzin</span></div>
      <div class="unit"><span class="num" id="minutes">--</span><span class="lbl">minut</span></div>
      <div class="unit"><span class="num" id="seconds">--</span><span class="lbl">sekund</span></div>
    </div>

    <p class="footer" id="message"></p>
  </main>

<script>
  var TARGET = new Date(2027, 3, 30, 0, 0, 0); // 30.04.2027, 00:00 czasu lokalnego

  function pad(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function dayWord(n) {
    var last = n % 10, lastTwo = n % 100;
    if (n === 1) return "dzień";
    if (last >= 2 && last <= 4 && (lastTwo < 12 || lastTwo > 14)) return "dni";
    return "dni";
  }

  function tick() {
    var diff = TARGET - new Date();

    if (diff <= 0) {
      document.getElementById("days").textContent = "0";
      document.getElementById("hours").textContent = "00";
      document.getElementById("minutes").textContent = "00";
      document.getElementById("seconds").textContent = "00";
      document.getElementById("message").textContent = "Czas lecieć! Miłej podróży 🌴";
      clearInterval(timer);
      return;
    }

    var totalSeconds = Math.floor(diff / 1000);
    var days = Math.floor(totalSeconds / 86400);
    var hours = Math.floor((totalSeconds % 86400) / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = pad(hours);
    document.getElementById("minutes").textContent = pad(minutes);
    document.getElementById("seconds").textContent = pad(seconds);
    document.getElementById("message").textContent =
      "Zostało " + days + " " + dayWord(days) + " do wylotu.";
  }

  tick();
  var timer = setInterval(tick, 1000);
</script>
</body>
</html>
